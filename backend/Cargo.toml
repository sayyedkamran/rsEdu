[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = "0.8.9"
axum-extra = { version = "0.10", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Async runtime
tokio = { version = "1.52.2", features = ["full"] }

# SeaORM with PostgreSQL support
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# Environment variables
dotenvy = "0.15.7"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# JWT
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }

# UUID for token generation
uuid = { version = "1.23.1", features = ["v4"] }

# Time handling
chrono = { version = "0.4.44", features = ["serde"] }

# Password hashing
argon2 = "0.5.3"



# Storage - S3 compatible (AWS S3, Cloudflare R2, MinIO)
aws-sdk-s3 = "1.0"
aws-config = "1.0"

# Google Cloud Storage
google-cloud-storage = "0.20"

# File handling
mime_guess = "2.0"
multer = "3.0"

# Async traits
async-trait = "0.1"

